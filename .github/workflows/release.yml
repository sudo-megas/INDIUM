# INDIUM — the release build. CORE §8: "Packages: `.pkg.tar.zst` (Arch) and `.deb`
# (Debian/Ubuntu), from P6 onward. Nothing else."
#
# Both packages and the plain tarball are built here, in containers, from what GitHub
# holds. Nothing a release ships is produced on the maker's own machine any more — not
# because that machine is untrustworthy, but because a machine is a variable and a
# container is a written-down constant. Whoever reads this file can see the entire
# provenance of every byte that ships; before P8's last commit they could see two thirds
# of it and had to take the Arch package on trust.
#
# Three jobs, and the third is the one that matters:
#
#   deb      debian:bookworm      → indium_<ver>-<rel>_amd64.deb, and the tarball
#   arch     archlinux:base-devel → indium-<ver>-<rel>-x86_64.pkg.tar.zst
#   verify   ubuntu-latest        → both packages, in one place, judged together
#
# `verify.sh` has always had INDIUM_PKG and INDIUM_DEB overrides for artefacts built
# somewhere other than the tree. Until this job existed there was nowhere both packages
# were ever present at once, so its strongest checks — the two payloads being identical
# under usr/, neither desktop entry mentioning RAR — could only ever be run by hand on a
# machine holding a .deb it had downloaded. Now they run on every release, and on every
# dispatch that rehearses one.
name: release

on:
  # The manual trigger is not a convenience, and it comes first for that reason. Without
  # it this workflow's first-ever run would be on the v1.0 tag — a tag that gets pushed
  # exactly once — and a typo in the rustup line or in an apt package name would burn it
  # on a red run. It is dispatched by hand on master, watched green, and only then does
  # the tag exist.
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Explicit and minimal. This workflow does not create a release, edit a release, or write
# anything back to the repository: it uploads the artefacts to the run and stops. The
# outward-facing act stays a separate human step, taken from the sudo-megas account and no
# other, as CORE §8 requires.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # The Debian package, and the tarball that comes off the same binary.
  # ---------------------------------------------------------------------------
  deb:
    runs-on: ubuntu-latest

    # THIS LINE IS THE WHOLE POINT OF THE JOB. The .deb has to declare the oldest glibc
    # that can run its binary, and `make-deb.sh` reads that floor out of the binary itself
    # rather than trusting anybody's memory. Built on the maker's Arch machine the same
    # binary imports GLIBC_2.43; bookworm ships 2.36, so an Arch-built .deb would honestly
    # declare a dependency that no Debian stable can satisfy. Building inside bookworm
    # makes the floor 2.36 by construction rather than by promise — there is nothing left
    # to remember, and nothing left to get wrong.
    #
    # The tarball comes off this binary and not the Arch one for the same reason: a
    # tarball declares no dependencies at all, so it is the artefact with the least
    # opportunity to warn anybody, and it should therefore be the one that runs in the
    # most places.
    container: debian:bookworm

    steps:
      # binutils for readelf (the floor) and for `ar t` (the read-back); xz-utils for the
      # two tar members; libarchive-dev for CORE §2's one hard system library.
      #
      # libarchive-tools is separate from libarchive-dev and easy to miss. On the maker's
      # Arch machine `bsdtar` ships inside the `libarchive` package itself, so it is simply
      # there once the library is; Debian splits the command-line tools out, and without
      # this line make-deb.sh reaches its first tar and stops.
      #
      # desktop-file-utils and file are here for verify.sh rather than for the build. Its
      # `need` helper counts a missing tool as a failed check and not as a skipped one —
      # deliberately, since a verifier that quietly stops verifying is worse than no
      # verifier — so anything it reaches for has to exist in this container or the step
      # goes red on a package that is perfectly sound.
      #
      # git is in this list because actions/checkout runs *inside* this container and uses
      # the container's git, not the runner's. Without it the checkout step falls back to
      # the REST tarball, which arrives without a .git directory — and make-deb.sh reads
      # the commit date out of git for its reproducible timestamps.
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates git build-essential pkg-config \
            libarchive-dev libarchive-tools xz-utils binutils \
            desktop-file-utils file

      # bookworm packages rustc 1.63, which cannot build eframe 0.36. rustup fetches a
      # current stable toolchain without adding an apt source to the image.
      #
      # `--profile minimal` leaves out rustfmt and clippy, and both are asked for by name
      # because the two gates below are now this workflow's rather than the maker's: a
      # release built entirely in containers has to hold itself to the whole standard, or
      # "built in CI" quietly means "built in CI, formatted wherever".
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable \
                --component rustfmt --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      # actions/checkout writes the tree as a different uid than the steps run as, so git
      # refuses the repository — "detected dubious ownership" — and make-deb.sh, which asks
      # git for the commit date behind its reproducible timestamps, exits 128. This is the
      # bug that the workflow_dispatch trigger above exists to catch, and it caught it: the
      # first run of this workflow failed here, on master, with no tag at stake. The
      # directory genuinely is safe; saying so is the documented fix.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$PWD"

      # Cargo.toml is the one place the version is written, and the PKGBUILD's `pkgrel` the
      # one place the revision is. CORE §7's tags are two-numeral (`v1.0`) where Cargo's are
      # three (`1.0.0`), so every form is derived here rather than typed anywhere — and on a
      # tag run the tag is made to agree, which is what catches a `v1.1` pushed over a tree
      # that still says 1.0.0.
      #
      # P10 found that this gate, as first written, made a second release structurally
      # impossible: it demanded `v${VER%.*}` and nothing else, so with the version unchanged
      # the only acceptable tag was one that had already been pushed. A fix that cannot be
      # released is not a fix. The rule now follows the revision:
      #
      #   pkgrel 1  → the tag is CORE §7's two-numeral form, `v1.0`
      #   pkgrel >1 → the tag carries the revision, `v1.0.0-2`
      #
      # which is stricter than what it replaced rather than looser — a revised tree tagged
      # `v1.0` is now refused, where before it would have built and shipped a second,
      # different set of artefacts under the first tag's name.
      - name: Version
        run: |
          VER=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          [ -n "$VER" ] || { echo "no version in Cargo.toml" >&2; exit 1; }
          REL=$(sed -n 's/^pkgrel=\([0-9][0-9]*\)$/\1/p' build/package/PKGBUILD | head -1)
          [ -n "$REL" ] || { echo "no pkgrel in build/package/PKGBUILD" >&2; exit 1; }
          if [ "$REL" = 1 ]; then EXPECT="v${VER%.*}"; else EXPECT="v${VER}-${REL}"; fi
          echo "VER=$VER"        >> "$GITHUB_ENV"
          echo "REL=$REL"        >> "$GITHUB_ENV"
          echo "TARBALL=indium-${VER}-${REL}-x86_64.tar.gz" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$EXPECT" ]; then
            echo "tag $GITHUB_REF_NAME is not $EXPECT (Cargo.toml $VER, pkgrel $REL)" >&2
            exit 1
          fi

      # The same remap the PKGBUILD's build() does, and for the same reason: panic locations
      # carry the paths a binary was compiled in, `strip` does not remove them, and nothing
      # warns about it. The Arch package would otherwise be path-clean while the .deb was not
      # — two packages this milestone says ship the same payload, built to different standards.
      # Written into GITHUB_ENV rather than one step's `env:` so the build and the tests see
      # identical flags and cargo does not rebuild the world between them; and computed from
      # $PWD and $CARGO_HOME rather than hardcoded, because a literal /root/.cargo would be a
      # more fragile thing than the leak it removes.
      - name: Set build flags
        run: |
          echo "RUSTFLAGS=--remap-path-prefix=$PWD=/usr/src/debug/indium --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}/registry=/usr/src/debug/indium/registry" >> "$GITHUB_ENV"

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test

      # CORE §2: "No GTK. No Qt. No KF6. No portal." — check-deps.sh is the enforcement,
      # and CORE §7 schedules it into CI at V1.4. It runs here from v1.0 because the
      # release build is precisely the build that must not have drifted.
      - name: Toolkit check
        run: ./build/check-deps.sh

      - name: Build .deb
        run: ./build/package/make-deb.sh target/release/indium

      # A first pass, inside the container that built the binary. It cannot see the Arch
      # package and will say SKIP where that is the subject; the verify job below is where
      # the two are judged against each other. Running it here anyway means a broken .deb
      # fails in the job that made it, next to the log that explains it.
      - name: Verify .deb
        run: ./build/package/verify.sh

      # CORE §8 ships two packages; the tarball is not a third package but the same binary
      # with no packaging at all, for the machines neither package fits. `-C target/release`
      # so the archive holds `indium` and not a path.
      #
      # The name carries the revision as of P10. It was `indium-1.0-x86_64.tar.gz`, built
      # from the two-numeral short version, which cannot express a revision at all — so a
      # `1.0.0-2` build would have produced a tarball with byte-different contents under
      # exactly the filename `v1.0` already ships. Two different binaries answering to one
      # name is the precise failure this project spent a milestone arguing against, and it
      # would have been ours.
      - name: Tarball
        run: tar czf "$TARBALL" -C target/release indium

      - uses: actions/upload-artifact@v4
        with:
          name: indium-deb
          path: build/package/out/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: indium-tar
          path: indium-*-x86_64.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # The Arch package.
  # ---------------------------------------------------------------------------
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      # base-devel carries binutils, fakeroot, pkgconf and sudo; it does not carry git,
      # and actions/checkout runs inside this container. `rust` is the makedepend that
      # matters. The six runtime depends are installed too, so `makepkg` finds them
      # already present and never has to call `pacman -S` as a user that is not root.
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm --needed \
            git rust libarchive wayland libxkbcommon libglvnd

      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$PWD"

      # The same gate as the deb job's, deliberately duplicated rather than shared: the two
      # jobs run in different containers and a shared step would have to be an action. If
      # one is ever edited the other must be edited with it.
      - name: Version
        run: |
          VER=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          [ -n "$VER" ] || { echo "no version in Cargo.toml" >&2; exit 1; }
          REL=$(sed -n 's/^pkgrel=\([0-9][0-9]*\)$/\1/p' build/package/PKGBUILD | head -1)
          [ -n "$REL" ] || { echo "no pkgrel in build/package/PKGBUILD" >&2; exit 1; }
          if [ "$REL" = 1 ]; then EXPECT="v${VER%.*}"; else EXPECT="v${VER}-${REL}"; fi
          echo "VER=$VER"        >> "$GITHUB_ENV"
          echo "REL=$REL"        >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$EXPECT" ]; then
            echo "tag $GITHUB_REF_NAME is not $EXPECT (Cargo.toml $VER, pkgrel $REL)" >&2
            exit 1
          fi

      # The PKGBUILD's `source=` is nailed to `#tag=v1.0`, and deliberately: a package is
      # built from what GitHub holds under a name that cannot move, never from a working
      # tree. That leaves the rehearsal with nothing to build — on a dispatch the tag does
      # not exist yet, which is the entire point of dispatching.
      #
      # So the fragment is rewritten here, and only the fragment: a tag run builds the tag
      # it was triggered by, a dispatch builds the commit it was triggered on. Both are
      # immutable names for exact content, both are fetched from GitHub over the network,
      # and the rehearsal therefore exercises the same clone, the same build(), the same
      # check() and the same package() as the release. The line is printed afterwards so
      # the log says which of the two happened rather than leaving it to be inferred.
      - name: Point the PKGBUILD at this run
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            frag="tag=$GITHUB_REF_NAME"
          else
            frag="commit=$GITHUB_SHA"
          fi
          sed -i "s|#tag=[^\"]*|#$frag|" build/package/PKGBUILD
          grep -n '^source=' build/package/PKGBUILD

      # makepkg refuses to run as root and is right to: build() and check() run arbitrary
      # code from the PKGBUILD, and fakeroot exists so that package() can write root-owned
      # files without any of the rest of it being root. The container starts as root, so a
      # user has to be made for it.
      - name: Build the package
        run: |
          useradd -m builder
          chown -R builder:builder "$PWD"
          su builder -c 'cd build/package && makepkg -f --noconfirm'

      - name: Show what was built
        run: ls -l build/package/*.pkg.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: indium-pkg
          path: build/package/*.pkg.tar.zst
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Both packages, together, judged against each other.
  # ---------------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    needs: [deb, arch]

    steps:
      - uses: actions/checkout@v4

      # libarchive-dev is here to build INDIUM's own reader, which is what reads the
      # packages; the rest are what verify.sh reaches for. Its `need` helper counts a
      # missing tool as a FAIL and not a SKIP, so a thin runner would fail a sound
      # package — every tool it can ask for is installed.
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libarchive-dev libarchive-tools \
            desktop-file-utils binutils file

      - uses: actions/download-artifact@v4
        with:
          path: artefacts

      - name: Version
        run: |
          VER=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          REL=$(sed -n 's/^pkgrel=\([0-9][0-9]*\)$/\1/p' build/package/PKGBUILD | head -1)
          echo "VER=$VER"        >> "$GITHUB_ENV"
          echo "REL=$REL"        >> "$GITHUB_ENV"
          echo "TARBALL=indium-${VER}-${REL}-x86_64.tar.gz" >> "$GITHUB_ENV"

      # The tarball holds the same binary the .deb wraps, so unpacking it into the place
      # the tree would have built one lets verify.sh run its ELF checks and CORE §2's
      # toolkit gate against the binary that actually ships. Without this those two checks
      # would SKIP, and a skip proves nothing.
      - name: Put the shipped binary where the checks look
        run: |
          mkdir -p target/release
          tar xzf "artefacts/indium-tar/$TARBALL" -C target/release
          chmod +x target/release/indium
          ls -l target/release/indium

      - name: Locate the artefacts
        run: |
          pkg=$(ls artefacts/indium-pkg/*.pkg.tar.zst)
          deb=$(ls artefacts/indium-deb/*.deb)
          echo "INDIUM_PKG=$PWD/$pkg" >> "$GITHUB_ENV"
          echo "INDIUM_DEB=$PWD/$deb" >> "$GITHUB_ENV"

      - name: Verify both packages
        run: ./build/package/verify.sh

      # `--test package_path` and not a bare `cargo test -- --ignored`, which would also
      # run src/platform/clipboard.rs's ignored test — that one wants a live Wayland
      # session and wl-paste, neither of which a runner has, and it would fail here for a
      # reason that has nothing to do with the packages. package_path.rs says the same
      # command in its own header.
      #
      # This is the strongest thing in the workflow: INDIUM's own reader opens both
      # packages and asserts they put identical files under usr/, differing only where
      # Arch and Debian each command their own paperwork, and that neither desktop entry
      # so much as mentions RAR.
      - name: The packages, read by INDIUM itself
        run: cargo test --test package_path -- --ignored
